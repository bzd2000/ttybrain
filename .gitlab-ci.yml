# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- mirror
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
test:
  stage: test
  image: oven/bun:1.4.4
  # A full run takes about 6 minutes; a hung test fails the job instead of blocking it for the 1 h default.
  timeout: 20 minutes
  script:
  - bun install --frozen-lockfile
  - bun typecheck
  - bun test --timeout 30000
node-smoke:
  stage: test
  image: node:26
  timeout: 20 minutes
  script:
  - npm ci
  - bash scripts/smoke-node.sh
# Pushes main to the public GitHub copy after the tests pass. Needs the masked, protected CI/CD variable
# GITHUB_TOKEN (a GitHub fine-grained token with Contents: read and write on bzd2000/ttybrain); without it the
# job is skipped. A plain push, not --force: if GitHub's main has commits GitLab doesn't, the job fails instead of
# overwriting them.
mirror-github:
  stage: mirror
  image: alpine:3.21
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITHUB_TOKEN
  variables:
    GIT_DEPTH: 0
  script:
  - apk add --no-cache git
  - git push "https://x-access-token:${GITHUB_TOKEN}@github.com/bzd2000/ttybrain.git" "HEAD:refs/heads/main"
